name: Build & Release

# - push to main: tests. If the version in package.json has no release yet
#   (tag v<version> missing), AppImage + Windows exe are built and the release
#   v<version> is created automatically (tag included).
# - tag v* pushed by hand: same as above for that tag
# - manual run: Actions tab -> "Build & Release" -> "Run workflow"
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build:
        description: "Also build AppImage + exe (without release)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$V")" ] && [ "$GITHUB_REF" != "refs/tags/v$V" ]; then
            REL=false
          else
            REL=true
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then REL=false; fi
          BUILD=$REL
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.build }}" = "true" ]; then BUILD=true; fi
          echo "release=$REL" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$V release=$REL build=$BUILD"

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Core tests (UDF patcher, answer file, protection list)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          cargo test --manifest-path core/Cargo.toml 2>&1 | tee logs/test.log
      - name: USB + kernel UDF integration tests (loop devices)
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosfstools wimtools bzip2 >/dev/null
          cargo build --manifest-path core/Cargo.toml --example wie-cli
          bash tools/test/usb_linux.sh 2>&1 | tee logs/usb-linux.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-test
          path: logs/
          retention-days: 5

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build core + CLI (Windows)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          cargo test --manifest-path core/Cargo.toml 2>&1 | tee logs/test-windows-build.log
          cargo build --manifest-path core/Cargo.toml --example wie-cli 2>&1 | tee -a logs/test-windows-build.log
      - name: Windows reads patched ISO + USB stick on virtual disk
        shell: pwsh
        run: |
          $log = Join-Path $PWD 'logs\usb-windows.log'
          New-Item -ItemType Directory -Force (Split-Path $log) | Out-Null
          try { & "$PWD\tools\test\usb_windows.ps1" *>&1 | Tee-Object -FilePath $log } catch { "EXCEPTION: $_" | Tee-Object -FilePath $log -Append }
          if (-not (Select-String -Path $log -Pattern 'ALL WINDOWS TESTS PASSED' -Quiet)) { exit 1 }
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-test-windows
          path: logs/
          retention-days: 5

  build-linux:
    needs: [meta, test]
    if: needs.meta.outputs.build == 'true'
    # Ubuntu 22.04 = older glibc -> AppImage also runs on SteamOS
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev file
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - name: Build AppImage
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          npx tauri build --bundles appimage 2>&1 | tee logs/linux.log
      - name: Collect
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          SRC=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          # SteamOS fix: the bundled libwayland (Ubuntu 22.04) is too old for the
          # host Mesa driver -> WebKit renderer crashes -> grey window.
          # Remove it so the system's libwayland is used (present on every desktop).
          rm -rf fix && mkdir fix && cd fix
          "../$SRC" --appimage-extract >/dev/null
          rm -fv squashfs-root/usr/lib/libwayland-*.so* squashfs-root/usr/lib/x86_64-linux-gnu/libwayland-*.so* 2>/dev/null || true
          if find squashfs-root -name 'libwayland-*.so*' | grep -q .; then echo "libwayland still bundled"; exit 1; fi
          # USB stick tools: static mkfs.fat + wimlib-imagex (for install.wim > 4 GB)
          bash ../tools/bundle_usb_tools.sh squashfs-root/usr/bin
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "../out/Windows-ISO-Editor_${V}_x86_64.AppImage"
          cd ..
          chmod +x out/*.AppImage
          ls -la out
      - name: Smoke test (starts and renders under Xvfb)
        shell: bash
        run: |
          sudo apt-get install -y xvfb imagemagick >/dev/null
          A=$(ls out/*.AppImage)
          cat > smoke.sh <<'EOF'
          A="$1"
          "$A" --appimage-extract-and-run > smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 18); do
            sleep 5
            import -window root shot.png 2>/dev/null || continue
            set -- $(convert shot.png -format '%[fx:int(255*p{55,450}.r)] %[fx:int(255*p{55,450}.g)] %[fx:int(255*p{55,450}.b)]' info:)
            echo "t=$((i*5))s pixel: $1 $2 $3"
            if [ "$1" -lt 40 ] && [ "$3" -gt $(( $1 + 5 )) ]; then echo OK > smoke.result; break; fi
          done
          xwininfo -root -tree > windows.txt 2>&1 || true
          kill $PID 2>/dev/null || true
          EOF
          sudo apt-get install -y x11-utils >/dev/null
          xvfb-run -a -s "-screen 0 1280x860x24" bash smoke.sh "$A"
          tail -20 smoke.log
          grep -i -E "iso|editor" windows.txt || true
          mkdir -p logs && cp shot.png logs/smoke.png && cp smoke.log logs/smoke.log && cp windows.txt logs/windows.txt
          if [ -f smoke.result ]; then echo "UI rendered"; else echo "UI did not render"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/
          retention-days: 7
          if-no-files-found: error
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux
          path: logs/
          retention-days: 5

  build-windows:
    needs: [meta, test, test-windows]
    if: needs.meta.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - name: Build Windows setup + portable exe
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          npx tauri build --bundles nsis 2>&1 | tee logs/windows.log
      - name: Collect
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/Windows-ISO-Editor_${V}_x64-setup.exe"
          for f in "src-tauri/target/release/windows-iso-editor.exe" "src-tauri/target/release/Windows ISO Editor.exe"; do
            if [ -f "$f" ]; then cp "$f" "out/Windows-ISO-Editor_${V}_x64-portable.exe"; break; fi
          done
          ls out/*-portable.exe
      - name: Smoke test (start exe, take screenshot)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem out\*-portable.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force logs | Out-Null
          $bmp.Save("logs\smoke-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          "alive=$(-not $p.HasExited)" | Tee-Object logs\smoke-windows.txt
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/
          retention-days: 7
          if-no-files-found: error
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows
          path: logs/
          retention-days: 5

  release:
    if: needs.meta.outputs.release == 'true'
    needs: [meta, test, test-windows, build-linux, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          V="${{ needs.meta.outputs.version }}"
          awk -v v="## v${V}" '$0 == v { f = 1; next } f && /^## / { exit } f { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Windows ISO Editor ${V}" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Windows ISO Editor v${{ needs.meta.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/linux/*.AppImage
            dist/windows/*.exe
          fail_on_unmatched_files: true

  # Writes the result of every job (plus logs) to the branch "ci-status",
  # so the state can be checked with plain git.
  report:
    if: always()
    needs: [meta, test, test-windows, build-linux, build-windows, release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: logs-*
          path: logs
      - name: Publish status
        shell: bash
        run: |
          mkdir -p st && cd st
          git init -q -b ci-status
          git config user.name "ci-status"
          git config user.email "ci-status@users.noreply.github.com"
          cat > status.txt <<EOF
          ref=${GITHUB_REF_NAME}
          version=${{ needs.meta.outputs.version }}
          sha=${GITHUB_SHA}
          run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          test=${{ needs.test.result }}
          test-windows=${{ needs.test-windows.result }}
          build-linux=${{ needs.build-linux.result }}
          build-windows=${{ needs.build-windows.result }}
          release=${{ needs.release.result }}
          EOF
          cp -r ../logs . 2>/dev/null || true
          find logs -name '*.log' -exec sh -c 'tail -n 400 "$1" > "$1.tmp" && mv "$1.tmp" "$1"' _ {} \; 2>/dev/null || true
          git add -A
          git commit -qm "CI status ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-status
