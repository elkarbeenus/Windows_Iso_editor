<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Windows ISO Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.png" alt="" class="logo" />
      <div>
        <div class="brand-name">Windows ISO Editor</div>
        <div class="brand-sub" data-i18n="tagline"></div>
      </div>
    </div>
    <nav class="steps" id="steps">
      <button class="step" data-step="1"><span class="num">1</span><span data-i18n="step1"></span></button>
      <span class="step-line"></span>
      <button class="step" data-step="2"><span class="num">2</span><span data-i18n="step2"></span></button>
      <span class="step-line"></span>
      <button class="step" data-step="3"><span class="num">3</span><span data-i18n="step3"></span></button>
    </nav>
    <div class="top-actions">
      <button class="chip-btn" id="langBtn" title="Sprache / Language">DE</button>
      <button class="icon-btn" id="infoBtn" title="Info"></button>
    </div>
  </header>

  <main>
    <!-- STEP 1 -->
    <section class="page" id="page1">
      <div class="hero">
        <h1 data-i18n="h1"></h1>
        <p class="lead" data-i18n="lead"></p>
      </div>
      <div class="drop" id="drop" tabindex="0">
        <div class="drop-icon" id="dropIcon"></div>
        <div class="drop-title" data-i18n="dropTitle"></div>
        <div class="drop-sub" data-i18n="dropSub"></div>
        <button class="btn primary" id="pickBtn" data-i18n="pick"></button>
      </div>
      <div id="isoInfo" class="iso-info hidden"></div>
      <div class="how">
        <div class="how-item"><div class="how-ico" data-ico="shield-check"></div><div><b data-i18n="how1t"></b><p data-i18n="how1"></p></div></div>
        <div class="how-item"><div class="how-ico" data-ico="sparkles"></div><div><b data-i18n="how2t"></b><p data-i18n="how2"></p></div></div>
        <div class="how-item"><div class="how-ico" data-ico="gamepad"></div><div><b data-i18n="how3t"></b><p data-i18n="how3"></p></div></div>
      </div>
    </section>

    <!-- STEP 2 -->
    <section class="page hidden" id="page2">
      <div class="section-head">
        <div>
          <h2 data-i18n="chooseTitle"></h2>
          <p class="muted" data-i18n="chooseSub"></p>
        </div>
        <div class="counter" id="counter"></div>
      </div>
      <div class="presets" id="presets"></div>
      <div class="protected" id="protected"></div>
      <div id="groups"></div>
    </section>

    <!-- STEP 3 -->
    <section class="page hidden" id="page3">
      <div class="section-head">
        <div>
          <h2 data-i18n="buildTitle"></h2>
          <p class="muted" data-i18n="buildSub"></p>
        </div>
      </div>
      <div class="build-grid">
        <div class="card">
          <div class="card-title" data-i18n="summary"></div>
          <div id="summary"></div>
        </div>
        <div class="card">
          <div class="card-title" data-i18n="output"></div>
          <div class="path-row">
            <div class="path" id="outPath">–</div>
            <button class="btn ghost" id="outBtn" data-i18n="change"></button>
          </div>
          <p class="hint" data-i18n="outHint"></p>
          <div id="buildArea">
            <button class="btn primary big" id="buildBtn"></button>
            <button class="btn link" id="xmlBtn" data-i18n="xmlOnly"></button>
          </div>
          <div id="progressArea" class="hidden">
            <div class="phases" id="phases"></div>
            <div class="bar"><div class="bar-fill" id="barFill"></div></div>
            <div class="bar-label" id="barLabel"></div>
          </div>
          <div id="resultArea" class="hidden"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bottombar">
    <button class="btn ghost" id="backBtn" data-i18n="back"></button>
    <div class="foot-note" id="footNote"></div>
    <button class="btn primary" id="nextBtn" data-i18n="next"></button>
  </footer>

  <div class="modal hidden" id="modal">
    <div class="modal-card" id="modalCard"></div>
  </div>
  <div class="toast hidden" id="toast"></div>

  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
